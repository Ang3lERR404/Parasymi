# Parasymi: what every key and mouse button does. Read once at startup
# (game/controls.zig). `action = name | name`: any of the names triggers it
# (up to 4). Keys use GLFW names: a..z, zero..nine, minus, space, tab,
# escape, enter, up/down/left/right, left_shift, left_control, left_alt,
# F1..F25, kp_0..kp_9. Mouse buttons: mouse_left, mouse_right,
# mouse_middle, mouse_four..mouse_eight. `#` starts a comment.

[bind]
moveForward = w | up
moveBack = s | down
moveLeft = a | left
moveRight = d | right
run = left_shift
# held: drag the mouse to orbit the camera round the wolf
orbit = mouse_middle
# held: free_cam toggles the free camera, rise sinks
alt = left_control
# held: plant what is in hand; on a structure, interact; choose a panel
# row; look in the free camera
use = mouse_left
# interact with a structure, harvest a plant
interact = e
# pressed or held: remove (uproot, take up, gather from a node); clears a
# hotbar slot
remove = mouse_right
# take up the seed or bulb of what is under the cursor
pick = q
harvest = f
# held with harvest: take from a structure
take = left_shift
configure = c
# turn what is under the cursor (else the next thing put down); held with
# counter, the other way
rotate = r
counter = left_shift
# with the belly open: throw away the stack under the cursor (or carried)
discard = delete
belly = tab
research = t
# alt mode: icons over the structures of what they weave or hold
overview = left_alt

# hotbar slots
slot1 = one
slot2 = two
slot3 = three
slot4 = four
slot5 = five
slot6 = six
slot7 = seven
slot8 = eight
slot9 = nine
slot10 = zero
slot11 = minus
slot12 = equal
slot13 = backspace

# free camera (alt + free_cam toggles it)
freeCam = f
flyFast = left_shift
rise = space
rollLeft = q
rollRight = e

# system
back = escape
quit = q
# while paused: open the options, the saved gardens
options = o
gardens = g
# typing a name: take back the last character, accept it
erase = backspace
confirm = enter | kp_enter
# save the garden being played (asking its name the first time), return
# to its last save
save = F6
load = F9
fullscreen = F11
debug = F3
