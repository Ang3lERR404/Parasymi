arsthraxia.desc = Arsthraxias think faster: +20% condensed unfed, x1.25 pace
sapSatellites.name = Sap Satellites
sapSatellites.desc = Arsthraxias grow: an offshoot, another satellite, +10% unfed
condensingWhorl.name = Condensing Whorl
condensingWhorl.desc = Arsthraxias grow: an offshoot, another satellite, +10% unfed
latticeOfThought.name = Lattice of Thought
latticeOfThought.desc = Arsthraxias grow: an offshoot, another satellite, +10% unfed
canopyWeaving.name = Canopy Weaving
canopyWeaving.desc = Weave Cavikoicyras: 2x2 mana reservoir trees
convergenceTheory.name = Convergence Theory
convergenceTheory.desc = Learn what the confluence condenses
celestialDefragmentation.name = Celestial Defragmentation
celestialDefragmentation.desc = Study the diamond's lattice: weave diamonds that project halos
deepRooting.name = Deep Rooting
deepRooting.desc = Weave Oryctaluumes: they gather from a node beside them
driftSpores.name = Drift Spores
driftSpores.desc = Weave Halyriphons: floaters that condense starlight
hungeringTendrils.name = Hungering Tendrils
hungeringTendrils.desc = Parasites drain x2
leySight.name = Ley Sight
leySight.desc = See the ley currents
rootCommunion.name = Root Communion
rootCommunion.desc = Symbiotic links reach 2 tiles
seedSplicing.name = Seed Splicing
seedSplicing.desc = Germinators weave Vesper seeds from both lineages
thinningVeil.name = The Thinning Veil
thinningVeil.desc = Hybrids yield x3. Something stirs
livingLooms.name = Living Looms
livingLooms.desc = Weave Loomferns and Coronisdilephyras: symbiotes that work for the garden
sporeCasting.name = Spore Casting
sporeCasting.desc = Weave Sporecasters: paired, they send what they are fed by spore, however far
braidedRoots.name = Braided Roots
braidedRoots.desc = Weave braided conduits: four lanes in one tile, each carrying its own kind, faster
lithophagy.name = Lithophagy
lithophagy.desc = Weave Lithophages and ganglia: parasites that draw stone from all round them and share out what they are fed
wovenStone.name = Woven Stone
wovenStone.desc = A Loomfern and a Lithophage side by side grow together into a Weftstone (a Monfris weaves more): they float over the nodes, draw them up and ionize them into ley crystals
braidedDrift.name = Braided Drift
braidedDrift.desc = A braided conduit and a Sporecaster side by side grow together into a Driftbraid: paired, each sends what it is fed to the other by spore and takes in what comes back
sharedNerves.name = Shared Nerves
sharedNerves.desc = A Coronisdilephyra and a ganglion side by side grow together into a Vultrixi: floaters tethered to a Monfris that pull what it needs out of the structures round them
interweaving.name = Interweaving
interweaving.desc = A Weftstone and a Driftbraid side by side grow together into a Monfris: 2x2 trees of both lineages that weave everything of both lineages, fed by up to six Vultrixi
unforming.name = The Unforming
unforming.desc = What the polyp dreams of: the radiant light shatters, the lineages die, and something new falls
mireBlooming.name = Mire Blooming
mireBlooming.desc = Germinators weave Helonycydira seeds: they root in soaked ground and drink it into convergence essence
stormCalling.name = Storm Calling
stormCalling.desc = Storm spires may be woven: they charge on ley crystals under the rain and strike the cloud into storms
rootWells.name = Root Wells
rootWells.desc = Root wells may be woven: they store the rain above the ground and pour it back round them when it dries
mossCreeping.name = Moss Creeping
mossCreeping.desc = Germinators weave Bryonifthofluris seeds: they turn the soil the rain soaks to moss, where a grove may root
temperedLight.name = Tempered Light
temperedLight.desc = The night beam is tempered: overdrive harms a plant half as hard. Only a Halcyra keeps one from it altogether
bentLight.name = Bent Light
bentLight.desc = Germinators weave Heliocyra seeds: they cast light in strips a tile wide and bend one another's round corners
halcyonVeil.name = Halcyon Veil
halcyonVeil.desc = Germinators weave Halcyra seeds: a plant one guards takes the night beam's overdrive and never dies of it
heldLight.name = Held Light
heldLight.desc = Germinators weave Astrocyme seeds: they store the light to spare and give it back when the structures round them go short

