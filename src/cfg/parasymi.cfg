# Parasymi: every player-facing string. Read once at startup (game/text.zig).
# `key = value`; `[a.b]` prefixes the keys below it; `#` starts a comment.
# Templates: {0}, {1} are the arguments in order; {0:.1} a number with one
# decimal; {{ a literal brace. Lists: entries separated by `|`.
# {@action} is the key or button bound to that action in controls.cfg,
# shown by its [key]/[mouse] name below (else its binding name in capitals).

