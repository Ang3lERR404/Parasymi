# Parasymi: what every key and mouse button does. Read once at startup
# (game/controls.zig). `action = name | name`: any of the names triggers it
# (up to 4). Keys use GLFW names: a..z, zero..nine, minus, space, tab,
# escape, enter, up/down/left/right, left_shift, left_control, left_alt,
# F1..F25, kp_0..kp_9. Mouse buttons: mouse_left, mouse_right,
# mouse_middle, mouse_four..mouse_eight. `#` starts a comment.

[bind]
move_forward = w | up
move_back = s | down
move_left = a | left
move_right = d | right
run = left_shift
yaw_left = q
yaw_right = e
# held: forward/back tilt the camera, free_cam toggles it, rise sinks
alt = left_control
# gather, place, choose a panel row; look in the free camera
use = mouse_left
uproot = mouse_right
harvest = f
# held with harvest: take from a structure
take = left_shift
configure = c
rotate = r
belly = tab
research = t

# hotbar slots
slot_1 = one
slot_2 = two
slot_3 = three
slot_4 = four
slot_5 = five
slot_6 = six
slot_7 = seven
slot_8 = eight
slot_9 = nine
slot_10 = zero
slot_11 = minus

# free camera (alt + free_cam toggles it)
free_cam = f
fly_fast = left_shift
rise = space
roll_left = q
roll_right = e

# system
back = escape
quit = q
save = F5
load = F9
fullscreen = F11
debug = F3
